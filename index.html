<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Kenai – AI från jorden till Mars</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Kenai – framtidens AI-motor för ljud, reels och kreatörer.">
  <style>
    /* Baslayout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
           background:
        radial-gradient(circle at top, rgba(7, 15, 35, 0.92) 0, rgba(2, 6, 23, 0.96) 55%, #000000 100%),
        url("kenai-earth-mars-bg..jpg");

      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .kenai-hero {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 32px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .kenai-hero {
        grid-template-columns: 1fr;
        text-align: center;
      }
    }

        /* LOGGA + ANIMATION */

    .kenai-orbit-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kenai-orbit {
      position: relative;
      width: min(320px, 70vw);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

       /* Själva coinet – bara loggan, ingen extra platta */
    .kenai-orbit img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      clip-path: circle(50%);
      object-fit: cover;
      display: block;
      filter: drop-shadow(0 0 24px rgba(56, 189, 248, 0.9));
      animation: kenaiPulse 3s ease-in-out infinite;
    }


       /* Eld/auran runt loggan – levande och färgskiftande */
    .kenai-orbit::before {
      content: "";
      position: absolute;
      inset: -6%;
      border-radius: 50%;
      background:
        conic-gradient(
          from 0deg,
          rgba(56, 189, 248, 0.0),
          rgba(56, 189, 248, 1),
          rgba(147, 51, 234, 1),
          rgba(249, 115, 22, 0.9),
          rgba(56, 189, 248, 0.0)
        );
      mix-blend-mode: screen;
      filter: blur(14px);
      opacity: 0.95;
      pointer-events: none;
      animation:
        kenaiOrbit 10s linear infinite,
        kenaiHue 8s linear infinite,
        kenaiFlame 2.2s ease-in-out infinite;
    }


    /* Inner glow – inifrån-och-ut-puls */
    .kenai-orbit::after {
      content: "";
      position: absolute;
      width: 60%;
      height: 60%;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(0, 255, 255, 0.95),
        rgba(0, 255, 255, 0.0) 70%
      );
      mix-blend-mode: screen;
      pointer-events: none;
      animation: kenaiCore 3s ease-in-out infinite;
    }



    /* TEXTDEL */

    .kenai-copy h1 {
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.1;
      margin-bottom: 16px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .kenai-copy h1 span {
      color: #38bdf8;
    }

    .kenai-copy p {
      font-size: 15px;
      line-height: 1.6;
      opacity: 0.86;
      max-width: 420px;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) {
      .kenai-copy p {
        margin-inline: auto;
      }
    }

    .kenai-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    @media (max-width: 768px) {
      .kenai-actions {
        justify-content: center;
      }
    }

    .kenai-button {
      border: none;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .kenai-button.primary {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #0b1120;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.7);
    }

    .kenai-button.primary:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 0 26px rgba(56, 189, 248, 0.9);
    }

    .kenai-button.secondary {
      background: rgba(15, 23, 42, 0.85);
      color: #e5e7eb;
      border: 1px solid rgba(148, 163, 184, 0.5);
      backdrop-filter: blur(12px);
    }

    .kenai-button.secondary:hover {
      background: rgba(15, 23, 42, 1);
      transform: translateY(-1px);
    }

    .kenai-badge {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 8px;
    }

        /* ANIMATIONER */

    @keyframes kenaiPulse {
      0% {
        transform: scale(1) translateX(0) translateY(0);
        filter: drop-shadow(0 0 18px rgba(0, 255, 255, 0.85));
      }
      25% {
        transform: scale(1.03) translateX(-1px) translateY(-1px);
      }
      50% {
        transform: scale(1.07) translateX(1px) translateY(-2px);
        filter: drop-shadow(0 0 32px rgba(0, 255, 255, 1));
      }
      75% {
        transform: scale(1.03) translateX(-1px) translateY(-0.5px);
      }
      100% {
        transform: scale(1) translateX(0) translateY(0);
        filter: drop-shadow(0 0 18px rgba(0, 255, 255, 0.85));
      }
    }

    /* Rök/eld-ringen snurrar runt */
    @keyframes kenaiOrbit {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    /* Färgerna skiftar igenom hela spektrat */
    @keyframes kenaiHue {
      0% {
        filter: blur(18px) hue-rotate(0deg);
      }
      100% {
        filter: blur(18px) hue-rotate(360deg);
      }
    }

    /* Flammans “andning” – pulserar i styrka */
    @keyframes kenaiFlame {
      0% {
        transform: scale(1);
        opacity: 0.7;
      }
      40% {
        transform: scale(1.06);
        opacity: 1;
      }
      100% {
        transform: scale(1.12);
        opacity: 0.6;
      }
    }

    /* Inre core-puls från mitten */
    @keyframes kenaiCore {
      0% {
        transform: scale(0.6);
        opacity: 0;
      }
      40% {
        transform: scale(1);
        opacity: 0.9;
      }
      100% {
        transform: scale(1.3);
        opacity: 0;
      }
    }

  </style>
</head>
<body>
  <main class="kenai-hero"> 
    <div class="kenai-orbit-wrap">
      <div class="kenai-orbit">
        <!-- Ändra filnamn här om din bild heter något annat -->
        <img src="kenai-coin-main.jpg" alt="Kenai logotyp">
      </div>
    </div>

    <section class="kenai-copy">
      <div class="kenai-badge">Från jorden till Mars</div>
      <h1><span>Kenai</span> – AI för ljud & reels</h1>
      <p>
        Spela in, sammanfatta och skapa klipp med AI.  
        Kenai hjälper dig att fatta mer, snabbare – oavsett om det är poddar, möten eller content till dina sociala medier.
      </p>
      <div class="kenai-actions">
        <a
          class="kenai-button primary"
          href="https://app.kenai.technology/recorder.html"
        >
          Öppna Kenai Recorder
        </a>
        <a
          class="kenai-button secondary"
          href="https://app.kenai.technology/reels.html"
        >
          Testa Reels Maker
        </a>
      </div>
    </section>
  </main>
</body>
</html>

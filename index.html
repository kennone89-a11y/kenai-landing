<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Kenai – AI från jorden till Mars</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Kenai – framtidens AI-motor för ljud, reels och kreatörer.">
  <style>
    /* Baslayout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

   body{
  margin:0;
  min-height:100vh;
  color:#fff;

  /* 1) Lägg bilden + mörk overlay i samma background */
  background-image:
    radial-gradient(1200px 700px at 55% 35%, rgba(15, 35, 75, .75), rgba(4, 8, 18, .92)),
    url("kenai-earth-mars-bg.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  /* Låser bilden snyggt på desktop */
  background-attachment: fixed;
}

/* iOS gillar inte fixed bg – då kör vi scroll */
@media (max-width: 900px){
  body{ background-attachment: scroll; }
}


    .kenai-hero {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 32px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .kenai-hero {
        grid-template-columns: 1fr;
        text-align: center;
      }
    }

        /* LOGGA + ANIMATION */

    .kenai-orbit-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kenai-orbit {
      position: relative;
      width: min(320px, 70vw);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

       /* Själva coinet – bara loggan, ingen extra platta */
    .kenai-coin-img{
  width: 360px;
  height: 360px;
  display:block;

  /* KLIPPER BORT FYRKANTEN (hörnen) */
  -webkit-mask-image: radial-gradient(circle, #000 62%, transparent 64%);
  mask-image: radial-gradient(circle, #000 62%, transparent 64%);

  /* Glans */
  filter: drop-shadow(0 0 22px rgba(0,255,255,.35));
}



       /* Eld/auran runt loggan – levande och färgskiftande */
    .kenai-orbit::before {
      content: "";
      position: absolute;
      inset: -6%;
      border-radius: 50%;
      background:
        conic-gradient(
          from 0deg,
          rgba(56, 189, 248, 0.0),
          rgba(56, 189, 248, 1),
          rgba(147, 51, 234, 1),
          rgba(249, 115, 22, 0.9),
          rgba(56, 189, 248, 0.0)
        );
      mix-blend-mode: screen;
      filter: blur(14px);
      opacity: 0.95;
      pointer-events: none;
      animation:
        kenaiOrbit 10s linear infinite,
        kenaiHue 8s linear infinite,
        kenaiFlame 2.2s ease-in-out infinite;
    }


    /* Inner glow – inifrån-och-ut-puls */
    .kenai-orbit::after {
      content: "";
      position: absolute;
      width: 60%;
      height: 60%;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(0, 255, 255, 0.95),
        rgba(0, 255, 255, 0.0) 70%
      );
      mix-blend-mode: screen;
      pointer-events: none;
      animation: kenaiCore 3s ease-in-out infinite;
    }



    /* TEXTDEL */

    .kenai-copy h1 {
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.1;
      margin-bottom: 16px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .kenai-copy h1 span {
      color: #38bdf8;
    }

    .kenai-copy p {
      font-size: 15px;
      line-height: 1.6;
      opacity: 0.86;
      max-width: 420px;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) {
      .kenai-copy p {
        margin-inline: auto;
      }
    }

    .kenai-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    @media (max-width: 768px) {
      .kenai-actions {
        justify-content: center;
      }
    }

    .kenai-button {
      border: none;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .kenai-button.primary {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #0b1120;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.7);
    }

    .kenai-button.primary:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 0 26px rgba(56, 189, 248, 0.9);
    }

    .kenai-button.secondary {
      background: rgba(15, 23, 42, 0.85);
      color: #e5e7eb;
      border: 1px solid rgba(148, 163, 184, 0.5);
      backdrop-filter: blur(12px);
    }

    .kenai-button.secondary:hover {
      background: rgba(15, 23, 42, 1);
      transform: translateY(-1px);
    }

    .kenai-badge {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 8px;
    }

        /* ANIMATIONER */

/* === KENAI LOGO FLAMES ANIMATION v2 (mer levande) === */
.logo-wrapper {
    position: relative;
    width: 350px;
    height: 350px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.hero-logo {
    width: 80%;
    position: relative;
    z-index: 5;
}

/* Bas-auran runt coinen */
.logo-flames {
    position: absolute;
    width: 160%;
    height: 160%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,0.35), transparent 55%),
        radial-gradient(circle at 20% 80%, rgba(0,255,255,0.45), transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(140,0,255,0.55), transparent 65%);
    mix-blend-mode: screen;
    filter: blur(30px);
    z-index: 1;
    animation: flameBasePulse 3s infinite ease-in-out;
}

/* Själva "lågan" som fladdrar */
.logo-flames::before,
.logo-flames::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 80%;
    height: 80%;
    transform: translate(-50%, -60%);
    border-radius: 50%;
    background:
        radial-gradient(ellipse at bottom,
            rgba(255,220,120,0.95) 0%,
            rgba(255,140,0,0.9) 35%,
            rgba(200,0,255,0.75) 55%,
            rgba(0,0,0,0) 75%);
    filter: blur(18px);
    mix-blend-mode: screen;
    opacity: 0.95;
    animation: flameFlicker 0.18s infinite alternate,
               flameDrift 6s infinite linear;
}

.logo-flames::after {
    width: 60%;
    height: 60%;
    opacity: 0.7;
    filter: blur(22px);
    animation: flameFlickerSmall 0.23s infinite alternate,
               flameDriftReverse 8s infinite linear;
}

/* Bas-puls av auran */
@keyframes flameBasePulse {
    0%   { transform: translate(-50%, -50%) scale(0.95); opacity: 0.65; filter: blur(32px) hue-rotate(0deg); }
    50%  { transform: translate(-50%, -50%) scale(1.15); opacity: 1;    filter: blur(26px) hue-rotate(80deg); }
    100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.65; filter: blur(32px) hue-rotate(360deg); }
}

/* Snabbt fladdrande låga */
@keyframes flameFlicker {
    0%   { transform: translate(-50%, -60%) scaleX(1.0)  scaleY(1.0);   opacity: 0.9; }
    25%  { transform: translate(-52%, -63%) scaleX(0.95) scaleY(1.25);  opacity: 1.0; }
    50%  { transform: translate(-48%, -58%) scaleX(1.05) scaleY(1.35);  opacity: 0.85; }
    75%  { transform: translate(-51%, -62%) scaleX(0.9)  scaleY(1.1);   opacity: 1.0; }
    100% { transform: translate(-50%, -60%) scaleX(1.0)  scaleY(1.0);   opacity: 0.9; }
}

/* Mindre inre flamma */
@keyframes flameFlickerSmall {
    0%   { transform: translate(-50%, -60%) scaleX(1.0)  scaleY(1.0);   opacity: 0.7; }
    50%  { transform: translate(-49%, -64%) scaleX(0.9)  scaleY(1.3);   opacity: 0.95; }
    100% { transform: translate(-50%, -60%) scaleX(1.05) scaleY(0.95);  opacity: 0.6; }
}

/* Lågan "driver runt" coinen långsamt */
@keyframes flameDrift {
    0%   { transform: translate(-50%, -60%) rotate(0deg)   scale(1); }
    50%  { transform: translate(-50%, -60%) rotate(180deg) scale(1.1); }
    100% { transform: translate(-50%, -60%) rotate(360deg) scale(1); }
}

@keyframes flameDriftReverse {
    0%   { transform: translate(-50%, -60%) rotate(0deg)    scale(0.95); }
    50%  { transform: translate(-50%, -60%) rotate(-180deg) scale(1.05); }
    100% { transform: translate(-50%, -60%) rotate(-360deg) scale(0.95); }
}


    /* Inre core-puls från mitten */
    @keyframes kenaiCore {
      0% {
        transform: scale(0.6);
        opacity: 0;
      }
      40% {
        transform: scale(1);
        opacity: 0.9;
      }
      100% {
        transform: scale(1.3);
        opacity: 0;
      }
    }
/* ===== Kenai Earth–Mars background ===== */
body{
  background:#050812;
}

body::before{
  content:"";
  position: fixed;
  inset: 0;
  background: url("kenai-earth-mars-bg..jpg") center / cover no-repeat;
  opacity: .28;                 /* justera 0.18–0.38 */
  filter: saturate(1.1) contrast(1.08);
  z-index: -2;
  pointer-events:none;
}

body::after{
  content:"";
  position: fixed;
  inset: 0;
  /* mörk overlay så texten blir tydlig */
  background:
    radial-gradient(1200px 700px at 30% 40%, rgba(0,180,255,.10), transparent 60%),
    radial-gradient(900px 600px at 70% 60%, rgba(160,60,255,.08), transparent 55%),
    linear-gradient(180deg, rgba(2,6,18,.86), rgba(2,6,18,.66));
  z-index: -1;
  pointer-events:none;
}

  </style>
</head>
<body>
  <main class="kenai-hero"> 
    <div class="kenai-orbit-wrap">
      <div class="kenai-orbit">
        <!-- Ändra filnamn här om din bild heter något annat -->
        <div class="kenai-coin">
  <div class="logo-wrapper">
    <img src="kenai_flame.webp" alt="Kenai logo" class="kenai-hero-image">
    <div class="logo-flames"></div>
</div>

</div>

      </div>
    </div>

    <section class="kenai-copy">
      <div class="kenai-badge">Från jorden till Mars</div>
      <h1><span>Kenai</span> – AI för ljud & reels</h1>
      <p>
        Spela in, sammanfatta och skapa klipp med AI.  
        Kenai hjälper dig att fatta mer, snabbare – oavsett om det är poddar, möten eller content till dina sociala medier.
      </p>
      <div class="kenai-actions">
        <a
          class="kenai-button primary"
          href="https://app.kenai.technology/recorder.html"
        >
          Öppna Kenai Recorder
        </a>
        <a
          class="kenai-button secondary"
          href="https://app.kenai.technology/reels.html"
        >
          Testa Reels Maker
        </a>
      </div>
    </section>
  </main>
 <script>
document.addEventListener('DOMContentLoaded', function () {
    lottie.loadAnimation({
        container: document.getElementById('kenai-icon'),
        renderer: 'svg',
        loop: true,

    });

</script>
</body>
</html>

<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kenai Reels (v1)</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:24px;max-width:820px}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    button{padding:10px 14px;border-radius:10px;border:1px solid #222;background:#111;color:#fff;cursor:pointer}
    button[disabled]{opacity:.5;cursor:not-allowed}
    .card{border:1px solid #ddd;border-radius:14px;padding:14px;margin-top:14px}
    pre{background:#f6f6f6;padding:10px;border-radius:10px;overflow:auto;min-height:48px}
    .muted{color:#555}
  </style>
</head>
<body>
  <h1>Kenai Reels (v1)</h1>
  <p class="muted">Välj media → Skapa reel → backend returnerar placeholder videoUrl (tills vi bygger riktig render).</p>

  <div class="card">
    <div class="row">
      <input id="files" type="file" multiple accept="video/*,image/*" />
      <button id="build" disabled>Skapa reel</button>
      <button id="clear" type="button">Rensa</button>
    </div>
    <p id="status" class="muted">Välj filer…</p>
    <pre id="resp"></pre>
  </div>

  <div class="card">
    <h3>Resultat</h3>
    <video id="player" controls playsinline style="width:100%;max-height:480px;background:#000;border-radius:12px"></video>
    <p><a id="download" href="#" download="kenai-reel.mp4" style="display:inline-block;opacity:.5;pointer-events:auto">Ladda ner MP4</a></p>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const filesEl  = $("files");
  const buildBtn = $("build");
  const clearBtn = $("clear");
  const statusEl = $("status");
  const respEl   = $("resp");
  const player   = $("player");
  const dl       = $("download");

  function setStatus(s) {
    statusEl.textContent = s;
  }

  function showResp(obj) {
    respEl.textContent =
      typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
  }

  function refreshUI() {
    const n = filesEl.files.length || 0;
    buildBtn.disabled = n === 0;
    setStatus(n ? `${n} fil(er) valda.` : "Välj filer…");
  }

  clearBtn.addEventListener("click", () => {
    filesEl.value = "";
    player.removeAttribute("src");
    player.load();
    showResp("");
    refreshUI();
  });

  filesEl.addEventListener("change", refreshUI);
  refreshUI();

  // ⬇⬇⬇ ENDA stället där await finns ⬇⬇⬇
  buildBtn.addEventListener("click", async () => {
    const n = filesEl.files.length || 0;
    if (!n) return;

    buildBtn.disabled = true;
    clearBtn.disabled = true;
    setStatus("AI jobbar…");
    showResp("");

    try {
      const fd = new FormData();
      for (const f of filesEl.files) fd.append("media", f);
      fd.append("style", "kenai");

      const r = await fetch(
        "https://snipp-ai-1.onrender.com/api/reels/build",
        { method: "POST", body: fd }
      );

      const text = await r.text();
      let data;

      try {
        data = JSON.parse(text);
      } catch {
        data = { ok: false, error: "invalid json", raw: text.slice(0, 200) };
      }

      showResp(data);

      if (!r.ok || !data.ok) {
        setStatus("Fel från backend");
        return;
      }

      const url = data.videoUrl || data.url;
      player.src = url;
      player.autoplay = true;
      player.controls = true;

     dl.href = "https://snipp-ai-1.onrender.com/api/download?url=" + encodeURIComponent(url);
dl.setAttribute("download", "reel.mp4");

      setStatus("Klart.");
    } catch (e) {
      setStatus("Fetch-fel: " + e.message);
    } finally {
      buildBtn.disabled = false;
      clearBtn.disabled = false;
    }
  });
})();
</script>

<script>
// KENAI_DL_GUARD
(function(){
  const dl = document.getElementById("download") || document.getElementById("dl");
  if(!dl) return;

  dl.addEventListener("click", function(e){
    const href = (dl.getAttribute("href") || "").trim();
    // Om vi inte har en riktig URL än -> blocka
    if(!href || href === "#" || href.startsWith("javascript:")){
      e.preventDefault();
      alert("Skapa reel först, sen kan du ladda ner MP4.");
      return false;
    }
  }, true);
})();
</script>

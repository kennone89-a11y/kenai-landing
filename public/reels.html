<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kenai Reels (v1)</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:24px;max-width:900px}
    h1{margin:0 0 8px}
    .muted{color:#555}
    .card{border:1px solid #e5e5e5;border-radius:12px;padding:16px;margin-top:12px}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    button{padding:10px 14px;border-radius:10px;border:1px solid #111;background:#111;color:#fff;cursor:pointer}
    button.secondary{background:#fff;color:#111}
    button:disabled{opacity:.5;cursor:not-allowed}
    .status{margin-top:10px;font-weight:600}
    .ok{color:#0a7a2f}
    .bad{color:#b00020}
    video{width:100%;max-width:760px;border-radius:12px;background:#000}
    a{display:inline-block;margin-top:8px}
    code{background:#f5f5f5;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <h1>Kenai Reels (v1)</h1>
  <div class="muted">Välj media → Skapa reel → API returnerar <code>videoUrl</code> (placeholder tills render byggs).</div>

  <div class="card">
    <div class="row">
      <input id="fileInput" type="file" multiple />
      <button id="btnBuild">Skapa reel</button>
      <button id="btnReset" class="secondary">Rensa</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div id="resultCard" class="card" style="display:none;">
    <h3 style="margin:0 0 10px;">Resultat</h3>
    <video id="videoEl" controls playsinline></video>
    <a id="dlEl" href="#" download style="display:none;">Ladda ner MP4</a>
  </div>

  <script>
    (function(){
      const API = "https://api.kenai.technology";
      const BUILD = "reels-ui-known-good-20260214-195530";
      console.log("KENAI_REELS_UI_BUILD", BUILD);

      const btnBuild = document.getElementById("btnBuild");
      const btnReset = document.getElementById("btnReset");
      const fileInput = document.getElementById("fileInput");
      const statusEl = document.getElementById("status");

      const resultCard = document.getElementById("resultCard");
      const videoEl = document.getElementById("videoEl");
      const dlEl = document.getElementById("dlEl");

      function setStatus(msg, ok){
        statusEl.textContent = msg || "";
        statusEl.className = "status " + (ok ? "ok" : (msg ? "bad" : ""));
      }

      function setBusy(on){
        btnBuild.disabled = !!on;
        btnReset.disabled = !!on;
        if (fileInput) fileInput.disabled = !!on;
      }

      async function postJSON(url, body, timeoutMs){
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), timeoutMs || 60000);
        try{
          const r = await fetch(url, {
            method:"POST",
            headers: {"content-type":"application/json"},
            body: JSON.stringify(body || {}),
            signal: ctrl.signal
          });
          const text = await r.text();
          let data = null;
          try{ data = JSON.parse(text); } catch(e){ data = null; }
          return { r, text, data };
        } finally {
          clearTimeout(t);
        }
      }

      async function doBuild(){
        setBusy(true);
        setStatus("AI jobbar…", true);
        resultCard.style.display = "none";
        dlEl.style.display = "none";
        if (videoEl) videoEl.removeAttribute("src");

        try{
          // Placeholder-läge: vi kör ping:true så vi alltid får en videoUrl tillbaka nu.
          const url = API + "/api/reels/build";
          const { r, data, text } = await postJSON(url, { ping:true }, 60000);

          if (!r.ok){
            const msg = (data && (data.error || data.message)) ? (data.error || data.message) : ("HTTP " + r.status);
            setStatus("Fel från API: " + r.status + (msg ? (" — " + msg) : ""), false);
            return;
          }

          if (!data || !data.videoUrl){
            setStatus("API svarade utan videoUrl.", false);
            return;
          }

          resultCard.style.display = "block";
          videoEl.src = data.videoUrl;
          dlEl.href = data.downloadUrl || data.videoUrl;
          dlEl.style.display = "inline-block";
          setStatus("Klart.", true);
        } catch(e){
          const msg = (e && e.name === "AbortError") ? "timeout" : (e && e.message ? e.message : String(e));
          setStatus("Krasch i UI: " + msg, false);
        } finally {
          setBusy(false);
        }
      }

      function doReset(){
        if (videoEl) videoEl.removeAttribute("src");
        resultCard.style.display = "none";
        dlEl.style.display = "none";
        if (fileInput) fileInput.value = "";
        setStatus("", true);
      }

      btnBuild.addEventListener("click", (e)=>{ e.preventDefault(); doBuild(); });
      btnReset.addEventListener("click", (e)=>{ e.preventDefault(); doReset(); });

      setStatus("Redo. (build: 20260214-195530)", true);
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kenai Reels (v1)</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:920px;margin:24px auto;padding:0 16px}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .card{border:1px solid #ddd;border-radius:12px;padding:16px;margin-top:16px}
    button{padding:10px 14px;border-radius:10px;border:1px solid #222;background:#111;color:#fff;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    input[type=file]{padding:10px;border:1px solid #ccc;border-radius:10px}
    pre{background:#0b0b0b;color:#eaeaea;padding:12px;border-radius:12px;overflow:auto}
    .muted{color:#666}
    .ok{color:#0a7a0a}
    .bad{color:#b00020}
    video{width:100%;border-radius:12px;background:#000}
  </style>
</head>
<body>
  <h1>Kenai Reels (v1)</h1>
  <p class="muted">Välj media → Skapa reel → API returnerar videoUrl (placeholder tills render byggs).</p>

  <div class="card">
    <div class="row">
      <input id="files" type="file" multiple accept="video/*,image/*" />
      <button id="btnBuild">Skapa reel</button>
      <button id="btnClear" type="button">Rensa</button>
      <span id="status" class="muted"></span>
    </div>

    <div id="result" style="margin-top:16px; display:none;">
      <h3>Resultat</h3>
      <video id="player" controls playsinline></video>
      <div style="margin-top:10px;">
        <a id="dl" href="#" download style="display:none;">Ladda ner MP4</a>
      </div>

      <h4 style="margin-top:16px;">Debug</h4>
      <pre id="dbg"></pre>
    </div>
  </div>

  <script>
    const API = "https://api.kenai.technology";
    const ENDPOINT = API + "/api/reels/build";

    const elFiles = document.getElementById("files");
    const btnBuild = document.getElementById("btnBuild");
    const btnClear = document.getElementById("btnClear");
    const elStatus = document.getElementById("status");
    const elResult = document.getElementById("result");
    const elDbg = document.getElementById("dbg");
    const elPlayer = document.getElementById("player");
    const elDl = document.getElementById("dl");

    function setStatus(msg, cls){
      elStatus.className = cls || "muted";
      elStatus.textContent = msg || "";
    }
    function setDbg(obj){
      elDbg.textContent = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
    }

    btnClear.addEventListener("click", () => {
      elFiles.value = "";
      elResult.style.display = "none";
      elPlayer.removeAttribute("src");
      elDl.style.display = "none";
      elDl.href = "#";
      setStatus("", "muted");
      setDbg("");
    });

    btnBuild.addEventListener('click', async () => {
  setStatus("Bygger (ping)...", "ok");
  btnBuild.disabled = true;
  try {
    // v1: ping-only. Ignorera filer tills vi bygger riktig upload/render.
    const r = await fetch(API + "/api/reels/build", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ ping: true })
    });

    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data || !data.videoUrl) {
      throw new Error((data && (data.error || data.message)) || ("HTTP " + r.status));
    }

    elPlayer.src = data.videoUrl;
    elDL.href = data.downloadUrl || data.videoUrl;
    elDL.style.display = "inline-block";
    elResult.style.display = "block";
    setStatus("Klart.", "ok");
  } catch (e) {
    setStatus("Krasch i UI: " + (e?.message || e), "bad");
    setDbg(String(e && (e.stack || e.message) || e));
  } finally {
    btnBuild.disabled = false;
  }
});
        const txt = await res.text();
        let data;
        try { data = JSON.parse(txt); } catch { data = { raw: txt }; }

        if (!res.ok) {
          setStatus("Fel från API: " + res.status, "bad");
          setDbg(data);
          return;
        }

        setDbg(data);
        // stöd för olika keys
        const videoUrl = data.videoUrl || data.url || data.result?.videoUrl || data.result?.url;
        if (!videoUrl) {
          setStatus("OK men ingen videoUrl i svaret.", "bad");
          return;
        }

        elPlayer.src = videoUrl;
        elDl.href = videoUrl;
        elDl.style.display = "inline-block";
        elResult.style.display = "block";
        setStatus("Klart.", "ok");
      } catch (e) {
        setStatus("Krasch i UI: " + (e?.message || e), "bad");
        setDbg(String(e));
      } finally {
        btnBuild.disabled = false;
      }
    });
  </script>
</body>
</html>

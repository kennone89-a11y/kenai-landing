<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kenai Reels (v1)</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; margin:0; background:#fff; color:#111;}
    .wrap{max-width:900px; margin:32px auto; padding:0 16px;}
    h1{margin:0 0 8px; font-size:44px; letter-spacing:-0.5px;}
    .sub{margin:0 0 18px; color:#333;}
    .card{border:1px solid #e6e6e6; border-radius:12px; padding:16px;}
    .row{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
    .btn{border-radius:10px; padding:10px 16px; border:1px solid #ddd; background:#fff; cursor:pointer; font-weight:600;}
    .btn.primary{background:#111; color:#fff; border-color:#111;}
    .btn:disabled{opacity:.55; cursor:not-allowed;}
    .status{margin-top:12px; padding:10px 12px; border-radius:10px; border:1px solid #eee; background:#fafafa;}
    .status.ok{border-color:#d6f5d6; background:#f3fff3; color:#0f6a0f;}
    .status.bad{border-color:#ffd5d5; background:#fff3f3; color:#a10f0f;}
    .result{margin-top:16px; display:none;}
    video{width:100%; border-radius:12px; background:#000;}
    a{color:#0b66ff; text-decoration:underline;}
    .small{color:#666; font-size:12px; margin-top:10px;}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Kenai Reels (v1)</h1>
    <p class="sub">Välj media → Skapa reel → API returnerar <b>videoUrl</b> (placeholder tills render byggs).</p>

    <div class="card">
      <div class="row">
        <input id="files" type="file" multiple />
        <button id="btnBuild" class="btn primary">Skapa reel</button>
        <button id="btnReset" class="btn">Rensa</button>
      </div>

      <div id="status" class="status">Redo. (build: reels-ui-multipart-v1-20260215-01)</div>

      <div id="result" class="result">
        <h3 style="margin:16px 0 8px;">Resultat</h3>
        <video id="player" controls playsinline></video>
        <div style="margin-top:10px;">
          <a id="dl" href="#" target="_blank" rel="noopener">Ladda ner MP4</a>
        </div>
      </div>

      <div class="small">UI_BUILD: reels-ui-multipart-v1-20260215-01</div>
    </div>
  </div>

<script>
(() => {
  const BUILD = "reels-ui-multipart-v1-20260215-01";
  const API = "https://api.kenai.technology";

  const fileInput = document.getElementById("files");
  const btnBuild  = document.getElementById("btnBuild");
  const btnReset  = document.getElementById("btnReset");
  const elStatus  = document.getElementById("status");
  const elResult  = document.getElementById("result");
  const elPlayer  = document.getElementById("player");
  const elDL      = document.getElementById("dl");

  function setStatus(msg, ok) {
    elStatus.textContent = msg;
    elStatus.classList.remove("ok", "bad");
    elStatus.classList.add(ok ? "ok" : "bad");
  }

  function setBusy(b) {
    btnBuild.disabled = !!b;
    btnReset.disabled = !!b;
    fileInput.disabled = !!b;
  }

  async function postJSON(url, obj, timeoutMs) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs || 60000);
    try {
      const r = await fetch(url, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(obj || {}),
        signal: ctrl.signal
      });
      let data = {};
      try { data = await r.json(); } catch (_) {}
      return { r, data };
    } finally {
      clearTimeout(t);
    }
  }

  async function postMultipart(url, files, timeoutMs) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs || 120000);
    try {
      const fd = new FormData();
      for (const f of files) fd.append("files", f, f.name);
      const r = await fetch(url, { method: "POST", body: fd, signal: ctrl.signal });
      let data = {};
      try { data = await r.json(); } catch (_) {}
      return { r, data };
    } finally {
      clearTimeout(t);
    }
  }

  async function doBuild() {
    setBusy(true);
    setStatus("AI jobbar…", true);
    elResult.style.display = "none";

    try {
      const url = API + "/api/reels/build";
      const files = (fileInput && fileInput.files) ? Array.from(fileInput.files) : [];

      let r, data;

      if (files.length > 0) {
        ({ r, data } = await postMultipart(url, files, 120000));
      } else {
        ({ r, data } = await postJSON(url, { ping: true }, 60000));
      }

      if (!r || !r.ok) {
        const msg = (data && (data.error || data.message)) ? (data.error || data.message) : ("HTTP " + (r ? r.status : "ERR"));
        setStatus("Fel från API: " + (r ? r.status : "ERR") + (msg ? " — " + msg : ""), false);
        return;
      }

      if (!data || !data.videoUrl) {
        setStatus("API svarade utan videoUrl.", false);
        return;
      }

      elPlayer.src = data.videoUrl;
      elDL.href = data.downloadUrl || data.videoUrl;
      elResult.style.display = "block";

      const rc = (typeof data.received === "number") ? (" (received: " + data.received + ")") : "";
      setStatus("Klart." + rc, true);

    } catch (e) {
      const msg = (e && e.name === "AbortError") ? "timeout" : (e && e.message ? e.message : String(e));
      setStatus("Krasch i UI: " + msg, false);
    } finally {
      setBusy(false);
    }
  }

  function doReset() {
    if (elPlayer) elPlayer.removeAttribute("src");
    if (elResult) elResult.style.display = "none";
    if (fileInput) fileInput.value = "";
    setStatus("Redo. (build: " + BUILD + ")", true);
  }

  if (btnBuild) btnBuild.addEventListener("click", (e) => { e.preventDefault(); doBuild(); });
  if (btnReset) btnReset.addEventListener("click", (e) => { e.preventDefault(); doReset(); });

  console.log("KENAI_REELS_UI_BUILD", BUILD);
})();
</script>
</body>
</html>

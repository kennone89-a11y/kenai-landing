<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kenai Reels (v1)</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:24px;max-width:920px}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    button{padding:10px 14px;border-radius:10px;border:1px solid #222;background:#111;color:#fff;cursor:pointer}
    button.secondary{background:#fff;color:#111}
    button:disabled{opacity:.5;cursor:not-allowed}
    #status{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid #ddd}
    #status.ok{border-color:#0a0}
    #status.bad{border-color:#a00}
    #result{margin-top:16px;display:none}
    video{width:100%;max-width:820px;border-radius:12px;border:1px solid #ddd;background:#000}
    a{display:inline-block;margin-top:10px}
    code{background:#f6f6f6;padding:2px 6px;border-radius:6px}
    #dbg{white-space:pre-wrap;font-size:12px;background:#fafafa;border:1px solid #eee;border-radius:10px;padding:10px;margin-top:10px;display:none}
  </style>
</head>
<body>
  <h1>Kenai Reels (v1)</h1>
  <p>Välj media → Skapa reel → API returnerar <code>videoUrl</code> (placeholder tills render byggs).</p>

  <div class="row">
    <input id="files" type="file" multiple />
    <button id="btnBuild">Skapa reel</button>
    <button id="btnReset" class="secondary">Rensa</button>
  </div>

  <div id="status">Redo. (build: <code>20260214-184528</code>)</div>
  <div id="dbg"></div>

  <div id="result">
    <h3>Resultat</h3>
    <video id="player" controls playsinline></video>
    <div><a id="dl" href="#" download>⭳ Ladda ner MP4</a></div>
  </div>

<script>
(() => {
  const API = "https://api.kenai.technology";
  const $ = (id) => document.getElementById(id);

  const elFiles = $("files");
  const btnBuild = $("btnBuild");
  const btnReset = $("btnReset");
  const elStatus = $("status");
  const elDbg = $("dbg");
  const elResult = $("result");
  const elPlayer = $("player");
  const elDl = $("dl");

  function setStatus(msg, cls) {
    elStatus.className = cls || "";
    elStatus.textContent = msg;
  }
  function setDbg(x) {
    elDbg.style.display = "block";
    elDbg.textContent = String(x);
  }

  async function doBuild() {
    btnBuild.disabled = true;
    setStatus("Jobbar…", "");
    setDbg("");

    try {
      // v1: IGNORERA filer – vi pingar API:t och visar placeholder-video.
      const r = await fetch(API + "/api/reels/build", {
        method: "POST",
        headers: {"content-type":"application/json"},
        body: JSON.stringify({ ping: true })
      });

      const ct = (r.headers.get("content-type") || "");
      const data = ct.includes("application/json") ? await r.json().catch(() => ({})) : null;
      const txt = data ? "" : await r.text().catch(() => "");

      if (!r.ok) {
        setStatus("Fel från API: " + r.status + (data && data.error ? " — " + data.error : ""), "bad");
        if (data) setDbg(JSON.stringify(data, null, 2)); else setDbg(txt);
        return;
      }

      if (!data || !data.videoUrl) {
        setStatus("API svarade utan videoUrl.", "bad");
        setDbg(data ? JSON.stringify(data, null, 2) : txt);
        return;
      }

      elPlayer.src = data.videoUrl;
      elDl.href = data.downloadUrl || data.videoUrl;
      elResult.style.display = "block";
      setStatus("Klart.", "ok");
      setDbg(JSON.stringify(data, null, 2));
    } catch (e) {
      setStatus("Krasch i UI: " + (e && e.message ? e.message : String(e)), "bad");
      setDbg(e && e.stack ? e.stack : String(e));
    } finally {
      btnBuild.disabled = false;
    }
  }

  function doReset() {
    elFiles.value = "";
    elPlayer.removeAttribute("src");
    elPlayer.load();
    elResult.style.display = "none";
    setStatus("Redo.", "");
    elDbg.style.display = "none";
    elDbg.textContent = "";
  }

  btnBuild.addEventListener("click", (e) => { e.preventDefault(); doBuild(); });
  btnReset.addEventListener("click", (e) => { e.preventDefault(); doReset(); });

  // sanity log (för att se att script kör)
  console.log("KENAI_REELS_UI_BUILD", "20260214-184528");
})();
</script>
</body>
</html>

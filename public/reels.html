<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kenai Reels (v1)</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:24px;max-width:900px}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    button{padding:10px 14px;border-radius:10px;border:1px solid #222;background:#111;color:#fff;cursor:pointer}
    button.secondary{background:#fff;color:#111}
    button:disabled{opacity:.5;cursor:not-allowed}
    .card{border:1px solid #ddd;border-radius:14px;padding:14px;margin-top:14px}
    .status{margin-top:10px;font-weight:600}
    .bad{color:#b00020}
    .ok{color:#0a7a2f}
    video{width:100%;max-height:360px;background:#000;border-radius:12px}
    a{display:inline-block;margin-top:8px}
    small{color:#666}
  </style>
</head>
<body>
  <h1>Kenai Reels (v1)</h1>
  <p><small>Välj media → Skapa reel → API returnerar videoUrl (placeholder tills render byggs).</small></p>

  <div class="card">
    <div class="row">
      <input id="files" type="file" multiple />
      <button id="btnBuild">Skapa reel</button>
      <button id="btnClear" class="secondary" type="button">Rensa</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div id="result" class="card" style="display:none">
    <h3>Resultat</h3>
    <video id="player" controls playsinline></video>
    <div><a id="dl" href="#" download style="display:none">Ladda ner MP4</a></div>
  </div>

  <script>
  (function(){
    const API = "https://api.kenai.technology";

    const elFiles  = document.getElementById("files");
    const btnBuild = document.getElementById("btnBuild");
    const btnClear = document.getElementById("btnClear");
    const elStatus = document.getElementById("status");
    const elResult = document.getElementById("result");
    const elPlayer = document.getElementById("player");
    const elDl     = document.getElementById("dl");

    function setStatus(msg, kind){
      elStatus.textContent = msg || "";
      elStatus.className = "status " + (kind || "");
    }

    btnClear.addEventListener("click", () => {
      elFiles.value = "";
      elResult.style.display = "none";
      elPlayer.removeAttribute("src");
      elDl.style.display = "none";
      setStatus("", "");
    });

    btnBuild.addEventListener("click", async (e) => {
      e.preventDefault();
      btnBuild.disabled = true;
      setStatus("Jobbar…", "");

      try {
        // v1: ping (placeholder). Sen byter vi till multipart upload.
        const r = await fetch(API + "/api/reels/build", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ ping: true, files: (elFiles.files ? elFiles.files.length : 0) })
        });

        let data = null;
        const ct = (r.headers.get("content-type") || "");
        if (ct.includes("application/json")) data = await r.json();
        else data = { ok:false, error: await r.text() };

        if (!r.ok) {
          // om backend ändå skickar ok:true + videoUrl, acceptera det.
          if (data && data.ok && data.videoUrl) {
            // fallthrough till success
          } else {
            setStatus("Fel från API: " + r.status + (data && data.error ? " — " + data.error : ""), "bad");
            return;
          }
        }

        if (!data || !data.videoUrl) {
          setStatus("API svarade utan videoUrl.", "bad");
          return;
        }

        elPlayer.src = data.videoUrl;
        elResult.style.display = "block";

        elDl.href = data.downloadUrl || data.videoUrl;
        elDl.style.display = "inline-block";

        setStatus("Klart.", "ok");
      } catch (err) {
        setStatus("Krasch i UI: " + (err && err.message ? err.message : String(err)), "bad");
      } finally {
        btnBuild.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>

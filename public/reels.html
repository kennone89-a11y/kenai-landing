<!doctype html>
<html lang="sv">
<head>
  <link rel="icon" href="/favicon.ico" />
<meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kenai Reels (v1)</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:24px;max-width:920px}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    button{padding:10px 14px;border-radius:10px;border:1px solid #222;background:#111;color:#fff;cursor:pointer}
    button.secondary{background:#fff;color:#111}
    button:disabled{opacity:.5;cursor:not-allowed}
    #status{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid #ddd}
    #status.ok{border-color:#0a0}
    #status.bad{border-color:#a00}
    #result{margin-top:16px;display:none}
    video{width:100%;max-width:820px;border-radius:12px;border:1px solid #ddd;background:#000}
    a{display:inline-block;margin-top:10px}
    code{background:#f6f6f6;padding:2px 6px;border-radius:6px}
    #dbg{white-space:pre-wrap;font-size:12px;background:#fafafa;border:1px solid #eee;border-radius:10px;padding:10px;margin-top:10px;display:none}
  </style>
</head>
<body>
  <h1>Kenai Reels (v1)</h1>
  <p>Välj media → Skapa reel → API returnerar <code>videoUrl</code> (placeholder tills render byggs).</p>

  <div class="row">
    <input id="files" type="file" multiple />
    <button id="btnBuild">Skapa reel</button>
    <button id="btnReset" class="secondary">Rensa</button>
  </div>

  <div id="status">Redo. (build: <code>20260214-184528</code>)</div>
  <div id="dbg"></div>

  <div id="result">
    <h3>Resultat</h3>
    <video id="player" controls playsinline></video>
    <div><a id="dl" href="#" download>⭳ Ladda ner MP4</a></div>
  </div>

<script>
(() => {
  "use strict";
  const API = "https://api.kenai.technology";

  // Resilient selectors (works even if ids change slightly)
  const qs = (sel) => document.querySelector(sel);
  const elStatus = document.getElementById("status") || (() => {
    const d = document.createElement("div");
    d.id = "status";
    d.style.margin = "10px 0";
    d.style.fontWeight = "600";
    (document.body || document.documentElement).prepend(d);
    return d;
  })();

  const btnBuild =
    document.getElementById("btnBuild") ||
    Array.from(document.querySelectorAll("button")).find(b => (b.textContent || "").toLowerCase().includes("skapa"));

  const btnReset =
    document.getElementById("btnReset") ||
    Array.from(document.querySelectorAll("button")).find(b => (b.textContent || "").toLowerCase().includes("rensa"));

  const fileInput =
    document.getElementById("files") ||
    document.getElementById("kenaiFiles") ||
    document.getElementById("fileInput") ||
    qs('input[type="file"]');

  const videoEl =
    document.getElementById("player") ||
    qs("video");

  // download link (optional)
  const dlEl =
    document.getElementById("dl") ||
    qs('a[download]') ||
    qs("a");

  function setStatus(msg, ok=true) {
    elStatus.textContent = msg;
    elStatus.style.color = ok ? "#2e7d32" : "#b00020";
  }

  function setBusy(isBusy) {
    if (!btnBuild) return;
    btnBuild.disabled = !!isBusy;
    if (isBusy) {
      btnBuild.dataset._oldText = btnBuild.textContent || "Skapa reel";
      btnBuild.textContent = "AI jobbar…";
      btnBuild.style.opacity = "0.9";
    } else {
      btnBuild.textContent = btnBuild.dataset._oldText || "Skapa reel";
      btnBuild.style.opacity = "";
    }
  }

  async function postJSON(url, body, timeoutMs=60000) {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort("timeout"), timeoutMs);
    try {
      const r = await fetch(url, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body || {}),
        signal: ac.signal
      });
      const ct = (r.headers.get("content-type") || "").toLowerCase();
      let data = null;
      if (ct.includes("application/json")) {
        try { data = await r.json(); } catch { data = null; }
      } else {
        const txt = await r.text().catch(() => "");
        data = { ok:false, error: txt || "non-json response" };
      }
      return { r, data };
    } finally {
      clearTimeout(t);
    }
  }

  async function doBuild() {
    if (!btnBuild) {
      setStatus("UI fel: hittar inte 'Skapa reel'-knapp.", false);
      return;
    }

    // For now endpoint is placeholder; we only "ping" it.
    // Later we add multipart upload, but not in stabiliseringssteget.
    setBusy(true);
    setStatus("AI jobbar…", true);

    try {
      const url = API + "/api/reels/build";
      // Build minimal payload (placeholder v1)
    const files = (fileInput && fileInput.files) ? Array.from(fileInput.files) : [];
    const payload = {
      filesCount: files.length,
      files: files.slice(0, 50).map(f => ({ name: f.name, type: f.type || "", size: f.size || 0 }))
    };

    const { r, data } = await postJSON(url, payload, 60000);

      if (!r.ok) {
        const msg = (data && (data.error || data.message)) ? (data.error || data.message) : ("HTTP " + r.status);
        setStatus("Fel från API: " + r.status + (msg ? (" — " + msg) : ""), false);
        return;
      }

      if (!data || !data.videoUrl) {
        setStatus("API svarade utan videoUrl.", false);
        return;
      }

      if (videoEl) videoEl.src = data.videoUrl;
      if (dlEl) {
        dlEl.href = data.downloadUrl || data.videoUrl;
        dlEl.style.display = "inline-block";
      }
      setStatus("Klart.", true);
    } catch (e) {
      const msg = (e && e.name === "AbortError") ? "timeout" : (e && e.message ? e.message : String(e));
      setStatus("Krasch i UI: " + msg, false);
    } finally {
      setBusy(false);
    }
  }

  function doReset() {
    if (videoEl) videoEl.removeAttribute("src");
    if (dlEl) dlEl.style.display = "none";
    if (fileInput) fileInput.value = "";
    setStatus("", true);
  }

  // Bind
  if (btnBuild) btnBuild.addEventListener("click", (e) => { e.preventDefault(); doBuild(); });
  if (btnReset) btnReset.addEventListener("click", (e) => { e.preventDefault(); doReset(); });

  // Build stamp for verification
  console.log("KENAI_REELS_UI_BUILD", "stabilize-v1");
})();
</script>
</body>
</html>

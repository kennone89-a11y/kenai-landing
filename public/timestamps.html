<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kenai Timestamps</title>
  <style>
    :root{--bg:#070c12;--panel:rgba(255,255,255,.06);--stroke:rgba(255,255,255,.14);--txt:rgba(255,255,255,.9);--muted:rgba(255,255,255,.65)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto}
    .wrap{max-width:920px;margin:0 auto;padding:28px 16px}
    .card{background:var(--panel);border:1px solid var(--stroke);border-radius:16px;padding:18px}
    h1{margin:0 0 10px;font-size:22px} .muted{color:var(--muted)}
    label{display:block;margin:12px 0 6px}
    input{width:100%;padding:12px 12px;border-radius:12px;border:1px solid var(--stroke);background:rgba(0,0,0,.35);color:var(--txt)}
    button{margin-top:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--stroke);background:rgba(255,255,255,.10);color:var(--txt);cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    pre{white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.35);border:1px solid var(--stroke);border-radius:12px;padding:12px;margin:12px 0 0}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .row button{margin-top:0}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Kenai Timestamps</h1>
      <div class="muted">Klistra in en YouTube-länk → få kapitel + summary. (API: api.kenai.technology)</div>

      <label for="url">YouTube-URL</label>
      <input id="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" />

      <div class="row">
        <button id="run">Skapa timestamps</button>
        <button id="copy" disabled>Kopiera kapitel</button>
      </div>

      <pre id="out" class="muted">Redo.</pre>
    </div>
  </div>

  <script src="/timestamps-ui.js"></script>
</body>
</html>
